<!DOCTYPE html>
<html>
<head>
    <title>Customer Signup</title>
    <style>
        body{margin:0;font-family:Arial;background:linear-gradient(135deg,#111,#6a0572);height:100vh;color:white;display:flex;justify-content:center;align-items:center}
        .box{width:430px;background:rgba(255,255,255,.14);padding:40px;border-radius:22px;text-align:center}
        h1{color:#ff7eb3}
        input{width:100%;padding:13px;margin:10px 0;border:none;border-radius:10px}
        button,a{display:block;width:100%;padding:13px;margin:12px 0;border:none;border-radius:25px;background:#ff4081;color:white;text-decoration:none;cursor:pointer}
    </style>
</head>
<body>
<div class="box">
    <h1>Create Customer Account</h1>
    <input placeholder="Full Name">
    <input placeholder="Email">
    <input type="password" placeholder="Password">
    <button onclick="alert('Account created successfully for demo'); window.location.href='/index.html';">Sign Up</button>
    <a href="/index.html">Back to Login</a>
</div>
</body>
</html>
