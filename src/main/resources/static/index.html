<!DOCTYPE html>
<html>
<head>
    <title>RadientHub BD Login</title>
    <style>
        body{margin:0;font-family:Arial;background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),url('https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1600&q=80');background-size:cover;background-position:center;height:100vh;color:white;display:flex;justify-content:center;align-items:center}
        .box{width:400px;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);padding:40px;border-radius:22px;text-align:center}
        h1{color:#ff7eb3}
        input{width:100%;padding:13px;margin:10px 0;border:none;border-radius:10px}
        button,a{display:block;width:100%;padding:13px;margin:12px 0;border:none;border-radius:25px;background:#ff4081;color:white;text-decoration:none;cursor:pointer}
        .admin{background:#6a0572}
    </style>
</head>
<body>
<div class="box">
    <h1>RadientHub BD</h1>
    <h3>Customer Login</h3>

    <input id="email" type="email" placeholder="Customer Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <a href="/signup.html">Create Account</a>
    <a class="admin" href="/admin-login.html">Admin Login</a>
</div>

<script>
    function login(){
        let email=document.getElementById("email").value;
        let pass=document.getElementById("password").value;

        if(email==="user@gmail.com" && pass==="1234"){
            window.location.href="/customer.html";
        }else{
            alert("Use demo login: user@gmail.com / 1234");
        }
    }
</script>
</body>
</html>
